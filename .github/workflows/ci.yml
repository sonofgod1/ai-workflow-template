name: CI

# La barrera que no se puede saltar. Los git hooks locales dan feedback rápido,
# pero `--no-verify` los anula; esto corre en el servidor y es lo que debe estar
# en verde para poder mergear. Configura branch protection en main y develop
# para exigirlo (ver /git-setup, paso 6).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ── Qué hay en este repo ────────────────────────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      python: ${{ steps.check.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          [ -f package.json ] && echo "node=yes" >> "$GITHUB_OUTPUT" || echo "node=no" >> "$GITHUB_OUTPUT"
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "python=yes" >> "$GITHUB_OUTPUT"
          else
            echo "python=no" >> "$GITHUB_OUTPUT"
          fi

  # ── Archivos que nunca deben entrar al repo ─────────────────────────────────
  # Misma lista que git-hooks/pre-commit, pero aquí no hay --no-verify.
  archivos-prohibidos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Verificar archivos prohibidos
        run: |
          PATTERNS='\.env$|\.env\.local$|\.env\.production$|\.env\.staging$|node_modules/|\.tsbuildinfo$|\.db$|\.sqlite3?$|\.DS_Store$|\.pem$|\.key$|\.p12$|__pycache__/|\.pyc$'
          FOUND=$(git ls-files | grep -E "$PATTERNS" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Archivos prohibidos versionados en el repo:"
            echo "$FOUND" | sed 's/^/  /'
            echo ""
            echo "Quítalos del índice y agrégalos a .gitignore:"
            echo "$FOUND" | sed 's|^|  git rm --cached |'
            exit 1
          fi
          echo "✓ Sin archivos prohibidos."

  # ── Formato de commits ──────────────────────────────────────────────────────
  # Mismo patrón que git-hooks/commit-msg. Cierra el bypass de --no-verify.
  commits-convencionales:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Validar el asunto de cada commit del PR
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([a-zA-Z0-9_.,/-]+\))?(!)?: .{1,100}$'
          BASE="${{ github.event.pull_request.base.sha }}"

          FAILED=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            SUBJECT=$(git log -1 --format=%s "$sha")
            case "$SUBJECT" in
              Merge\ *|Rebase\ *|fixup!\ *|squash!\ *|Revert\ \"*) continue ;;
            esac
            if ! printf '%s\n' "$SUBJECT" | grep -qE "$PATTERN"; then
              echo "::error::Commit ${sha:0:7} — asunto inválido: $SUBJECT"
              FAILED=1
            fi
          done < <(git rev-list "$BASE..HEAD")

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "Formato requerido: tipo(scope): descripción"
            echo "Tipos: feat fix docs style refactor test chore perf ci build revert"
            exit 1
          fi
          echo "✓ Todos los commits siguen el formato convencional."

  # ── Secretos ────────────────────────────────────────────────────────────────
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --verbose --no-banner

  # ── JS / TS ─────────────────────────────────────────────────────────────────
  javascript:
    needs: detect
    if: needs.detect.outputs.node == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: |
          if [ -x node_modules/.bin/biome ]; then
            node_modules/.bin/biome check .
          elif [ -x node_modules/.bin/eslint ]; then
            node_modules/.bin/eslint . --max-warnings=0
          else
            echo "⚠️  Sin linter instalado (biome o eslint). Saltando."
          fi

      - name: Type-check
        run: |
          if [ -f tsconfig.json ] && [ -x node_modules/.bin/tsc ]; then
            node_modules/.bin/tsc --noEmit --skipLibCheck
          else
            echo "⚠️  Sin TypeScript. Saltando."
          fi

      - name: Tests
        run: |
          if grep -q '"test":' package.json; then
            npm test
          else
            echo "⚠️  Sin script 'test' en package.json. Saltando."
          fi

  # ── Python ──────────────────────────────────────────────────────────────────
  python:
    needs: detect
    if: needs.detect.outputs.python == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: |
          CODE=0
          pytest --tb=short || CODE=$?
          # pytest devuelve 5 cuando no recolectó ningún test.
          if [ "$CODE" -eq 5 ]; then
            echo "⚠️  Sin tests todavía."
            exit 0
          fi
          exit "$CODE"

  # ── Índice de hallazgos ─────────────────────────────────────────────────────
  # El markdown lleva la prosa; docs/findings.json lleva lo verificable. Esto
  # comprueba que los hashes de commit con los que se cerró un hallazgo existan
  # de verdad, y que main no lleve bloqueantes abiertos.
  hallazgos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Validar índice de hallazgos
        run: |
          if [ ! -f docs/findings.json ]; then
            echo "✓ Sin índice de hallazgos todavía."
            exit 0
          fi
          # --exigir-test: un hallazgo cerrado sin test ni exención registrada no
          # pasa. Es la barrera que evita que el humano quede como único arnés de
          # pruebas del proyecto.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python3 .workflow/findings.py validate --sin-bloqueantes --exigir-test
          else
            python3 .workflow/findings.py validate --exigir-test
          fi

      - name: decisiones.md al día con el índice
        run: |
          # decisiones.md es generado. Si alguien lo editó a mano, o commiteó el
          # índice sin el markdown, aquí se ve: mantenerlos sincronizados a mano
          # era el paso que se olvidaba.
          [ -f docs/findings.json ] || exit 0
          python3 .workflow/findings.py decisiones --check

  # ── Derivados generados ─────────────────────────────────────────────────────
  # .cursor/rules/ se genera desde .claude/commands/ y CLAUDE.md. Nada comprobaba
  # que estuvieran al día, así que un cambio en los comandos dejaba a Cursor con
  # instrucciones viejas sin que nadie se enterara.
  generados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reglas de Cursor al día
        run: |
          [ -f generate-cursor-rules.sh ] || exit 0
          # Un proyecto que no usa Cursor no tiene nada que mantener al día, y
          # exigirle 17 .mdc que no quiere es CI rojo por no usar una herramienta
          # opcional. La comprobación aplica solo si el derivado existe.
          if [ ! -d .cursor/rules ]; then
            echo "✓ Este proyecto no usa Cursor (.cursor/rules/ no existe)."
            exit 0
          fi
          bash generate-cursor-rules.sh --check

  # ── Tests del propio andamiaje ──────────────────────────────────────────────
  # Los scripts de .workflow/ son la barrera del proyecto, así que sus tests tienen
  # que correr en algún sitio: si no, la regla "todo hallazgo deja un test" no
  # aplica al código que la hace cumplir.
  andamiaje:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Tests de .workflow/
        run: |
          shopt -s nullglob
          TESTS=(.workflow/tests/test-*.py)
          if [ ${#TESTS[@]} -eq 0 ]; then
            echo "✓ Sin tests de andamiaje."
            exit 0
          fi
          # git worktree y los repos temporales de los tests necesitan identidad.
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          FALLOS=0
          for t in "${TESTS[@]}"; do
            echo "── $t"
            python3 "$t" || FALLOS=1
          done
          exit $FALLOS
        shell: bash

  # ── Contrato de verificación ────────────────────────────────────────────────
  # Solo para repos que declararon sus propios pasos. Los jobs javascript/python
  # de arriba cubren los stacks detectables; esto cubre el resto (bash, Go, Rust,
  # o cualquier proyecto con comandos propios) sin duplicar nada.
  #
  # --strict aquí y no en local: un paso saltado por falta de herramienta es
  # tolerable mientras trabajas, pero en la barrera que no se puede saltar tiene
  # que contar como fallo. Si no, "sin linter instalado" pasa por verde.
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Estos dos no cuestan nada si el proyecto no los usa, y sin ellos
      # CI_SETUP no tiene con qué instalar dependencias.
      #
      # La versión la fija el proyecto, no CI. '3.x' resolvía al Python más nuevo
      # publicado, así que un proyecto probado en 3.11 se verificaba contra 3.14 y
      # fallaba por incompatibilidades de sus dependencias con un intérprete que
      # nunca va a usar. Un CI que prueba otra cosa que producción no es una
      # barrera: es una fuente de falsos rojos.
      - name: Versiones que fija el proyecto
        id: versiones
        run: |
          if [ -f .python-version ]; then
            echo "py_file=.python-version" >> "$GITHUB_OUTPUT"
          else
            echo "py=3.12" >> "$GITHUB_OUTPUT"
          fi
          if [ -f .nvmrc ]; then
            echo "node_file=.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "node=20" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.versiones.outputs.py }}
          python-version-file: ${{ steps.versiones.outputs.py_file }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versiones.outputs.node }}
          node-version-file: ${{ steps.versiones.outputs.node_file }}

      - name: Contrato de verificación
        run: |
          if [ ! -f .workflow/verify.conf ]; then
            echo "⚠️  Sin .workflow/verify.conf; los jobs por stack cubren este repo."
            exit 0
          fi

          # El runner llega vacío: sin dependencias, sin linters, sin node_modules.
          # verify.sh no puede adivinar cómo prepararlos, así que el proyecto lo
          # declara en CI_SETUP. Sin esto, un repo con dependencias veía fallar sus
          # cinco pasos en cuatro segundos y el job no significaba nada.
          CI_SETUP=()
          # shellcheck source=/dev/null
          . .workflow/verify.conf
          if [ ${#CI_SETUP[@]} -eq 0 ]; then
            echo "ℹ️  Sin CI_SETUP en verify.conf: se asume que los pasos no necesitan"
            echo "   preparación. Si tu proyecto tiene dependencias, declaralas ahí."
          fi
          for cmd in "${CI_SETUP[@]}"; do
            echo "── setup: $cmd"
            eval "$cmd" || { echo "❌ falló la preparación"; exit 1; }
          done

          bash .workflow/verify.sh --strict
        shell: bash

  # ── Dependencias vulnerables ────────────────────────────────────────────────
  # Antes esto era un ítem del checklist de /security que alguien tenía que
  # acordarse de correr. Una CVE conocida en una dependencia directa no se
  # descubre cuando el humano se acuerda.
  dependencias:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.detect.outputs.node == 'yes'
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias Node
        if: needs.detect.outputs.node == 'yes'
        # --ignore-scripts: auditar no debe ejecutar los postinstall del árbol
        # que estamos auditando precisamente por no confiar en él.
        run: npm ci --ignore-scripts

      - uses: actions/setup-python@v5
        if: needs.detect.outputs.python == 'yes'
        with:
          python-version: '3.12'

      - name: Instalar pip-audit
        if: needs.detect.outputs.python == 'yes'
        run: pip install pip-audit

      - name: Auditar dependencias
        run: bash .workflow/audit-deps.sh

  # ── Seguridad de migraciones ────────────────────────────────────────────────
  # El incidente clásico de despliegue: una migración que borra una columna
  # mientras la versión anterior de la aplicación sigue corriendo. Durante un
  # rolling update las dos versiones conviven.
  migraciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Revisar migraciones del cambio
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .workflow/check-migrations.py --base "${{ github.event.pull_request.base.sha }}"
          else
            python3 .workflow/check-migrations.py --all
          fi
