# Reglas de lint para las herramientas de .workflow/.
#
# Se declara explícitamente en vez de confiar en los defaults de ruff: los
# defaults cambian entre versiones, y un lint que se comporta distinto según qué
# ruff tengas instalado no sirve como barrera. Lo que aquí está seleccionado es
# lo que este repo considera un error de verdad.

target-version = "py39"
line-length = 110

[lint]
select = [
    "E",      # pycodestyle: errores
    "F",      # pyflakes: nombres sin definir, imports muertos
    "W",      # avisos de pycodestyle
    "I",      # orden de imports
    "UP",     # sintaxis obsoleta para la versión objetivo
    "B",      # bugbear: trampas reales en tiempo de ejecución
    "SIM",    # simplificaciones
    "PLW",    # avisos de pylint
    "RUF",    # reglas propias de ruff
    "EXE",    # shebang y permisos coherentes
]

ignore = [
    # `re.I` es legible y es lo que usa la documentación de la stdlib. Cambiarlo
    # por `re.IGNORECASE` en 26 sitios no arregla ningún defecto.
    "FURB167",

    # Concatenación implícita de cadenas dentro de una lista. Aquí es deliberada:
    # las descripciones largas se parten en varias líneas para que quepan, y
    # algunas cadenas se parten a propósito por trozos ("TRUN" + "CATE") para que
    # estos archivos se puedan editar desde el agente sin que el hook de comandos
    # destructivos se dispare al leer su propio contenido.
    "ISC004",

    # `date.today()` sin zona horaria. Estos campos son fechas de calendario en la
    # zona de quien trabaja, no instantes: la zona no aporta y complica el formato.
    "DTZ011",

    # Reasignar la variable del bucle (`for x in ...: x = x.strip()`) es idiomático
    # y no esconde ningún defecto aquí: en los tres casos se normaliza el valor
    # antes de usarlo, no se pierde ninguno.
    "PLW2901",

    # Glifos "ambiguos" en las cadenas de salida. Son deliberados: ℹ, ✓ y ❌ son
    # la interfaz de estas herramientas en la terminal, no identificadores.
    "RUF001",
]

[lint.per-file-ignores]
# Los tests declaran comandos peligrosos como datos de prueba.
".workflow/tests/*" = ["E501"]
