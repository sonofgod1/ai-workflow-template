# Contrato de verificación de la plantilla.
#
# Este repositorio ES el andamiaje, así que lo que hay que verificar son sus
# propias herramientas: que linten limpio y que sus tests pasen. Sin este archivo
# la plantilla no lintaba su propio código, y así entraron 19 errores de ruff a
# .workflow/ que aparecieron recién al sincronizar en un proyecto real.

# El runner llega vacío: sin esto, lint-python sale con 127 ("ruff no instalado") y
# --strict lo cuenta como fallo, que es lo correcto — un paso sin herramienta no es
# una excepción registrada, es un paso que nadie verificó. La plantilla predicaba
# CI_SETUP para sus consumidores y no lo declaraba para sí misma: su propio CI
# llevaba dos días en rojo por exactamente el bug que este archivo enseña a evitar.
CI_SETUP=(
  "pip install -q ruff"
)

VERIFY_STEPS=(
  "lint-python:if command -v ruff > /dev/null 2>&1; then ruff check .workflow/ ; else echo 'ruff no instalado'; exit 127; fi"
  "tests-andamiaje:for t in .workflow/tests/test-*.py; do python3 \"\$t\" > /dev/null || exit 1; done"
  "derivados:bash generate-cursor-rules.sh --check"
)
