# .workflow/verify.conf — pasos de verificación de ESTE repositorio.
#
# El template no es un proyecto Node ni Python: es bash + markdown generado.
# La autodetección de verify.sh no tiene nada que detectar aquí, y "sin stack"
# se reporta como parcial, que es correcto pero inútil. Estos son los pasos que
# de verdad pueden romperse en este repo.
#
# Se usa `find`, no `git ls-files`: un script recién creado y todavía sin
# trackear es exactamente el que más falta hace verificar.

VERIFY_STEPS=(
  "sintaxis-bash:find . \( -name '*.sh' -o -path './git-hooks/*' \) -not -path './.git/*' -type f -print0 | xargs -0 -n1 bash -n"
  "sintaxis-python:find . -name '*.py' -not -path './.git/*' -not -path '*/node_modules/*' -type f -print0 | xargs -0 -n1 python3 -c 'import ast,sys; ast.parse(open(sys.argv[1],encoding=\"utf-8\").read())'"
  "lint-python:if command -v ruff > /dev/null 2>&1; then ruff check .workflow/; else echo 'ruff no instalado'; exit 1; fi"
  "reglas-cursor:bash generate-cursor-rules.sh --check"
  "hallazgos:python3 .workflow/findings.py validate"
  "migraciones:python3 .workflow/check-migrations.py --all"
  "tests:python3 .workflow/tests/test-danger-scan.py"
)
